name: release

on:
  workflow_dispatch:
  release:
    types: [released]

# OIDC trusted publishing to npm requires id-token: write so the job can mint
# the OIDC token that npm exchanges for a short-lived publish credential. No
# long-lived NPM_TOKEN is needed and provenance attestations are generated.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Enable corepack
      run: corepack enable
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Test Services
      run: pnpm test:services:start

    - name: Wait for Services
      run: sleep 5

    - name: Testing
      run: pnpm test

    - name: Publish
      run: pnpm publish:packages
