name: release

on:
  workflow_dispatch:
  release:
    types: [released]

# OIDC trusted publishing to npm requires id-token: write so the job can mint
# the OIDC token that npm exchanges for a short-lived credential. CI only
# stages (`npm stage publish`); a maintainer promotes with 2FA. No long-lived
# NPM_TOKEN is needed and provenance attestations are generated.
permissions:
  contents: read

jobs:
  aikido-gate:
    name: Aikido release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Aikido CI client
        run: sfw npm install --global @aikidosec/ci-api-client@1.0.17
      - name: Run Aikido release scan
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          AIKIDO_CLIENT_API_KEY: ${{ secrets.AIKIDO_CLIENT_API_KEY }}
        run: >
          aikido-api-client scan-release
          "$REPO_NAME" "$GITHUB_SHA"
          --apikey "$AIKIDO_CLIENT_API_KEY"
          --fail-on-sast-scan --fail-on-iac-scan --fail-on-secrets-scan

  build:

    needs: [aikido-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Socket Firewall
      uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
        firewall-version: "1.15.0"
    - name: Enable corepack
      run: corepack enable
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org
        package-manager-cache: false
    - name: Install npm for staged publishing
      run: sfw npm install --global npm@11.19.0

    - name: Install Dependencies
      run: sfw pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Test Services
      run: pnpm test:services:start

    - name: Wait for Services
      run: sleep 5

    - name: Testing
      run: pnpm test

    - name: Stage publish
      run: pnpm publish:packages
